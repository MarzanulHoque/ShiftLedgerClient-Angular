<div class="stat-tile" [class]="'stat-tile--' + color">
  <div class="stat-tile-head">
    <span class="stat-tile-label">{{ label }}</span>
    <span class="stat-tile-icon"><mat-icon>{{ icon }}</mat-icon></span>
  </div>
  <div class="stat-tile-value">{{ value }}</div>
  @if (sub) {
    <div class="stat-tile-sub">{{ sub }}</div>
  }
  @if (trend; as t) {
    <div class="stat-tile-trend" [class]="'stat-tile-trend--' + t.tone">
      <mat-icon inline>{{ t.icon }}</mat-icon>
      <span>{{ t.label }}</span>
      <span class="stat-tile-trend-context">vs yesterday</span>
    </div>
  }
</div>
