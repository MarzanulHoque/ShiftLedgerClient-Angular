<h2 mat-dialog-title>Edit job</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="job-form">
    <mat-form-field appearance="outline">
      <mat-label>Title</mat-label>
      <input matInput formControlName="title" />
      @if (form.controls.title.invalid && form.controls.title.touched) {
        <mat-error>Title is required</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Bike model</mat-label>
      <input matInput formControlName="bikeModel" />
      @if (form.controls.bikeModel.invalid && form.controls.bikeModel.touched) {
        <mat-error>Bike model is required</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="2"></textarea>
    </mat-form-field>

    <div class="field-row">
      <mat-form-field appearance="outline">
        <mat-label>Priority</mat-label>
        <mat-select formControlName="priority">
          @for (p of priorities; track p) {
            <mat-option [value]="p">{{ p }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Due</mat-label>
        <input matInput type="date" formControlName="dueDate" />
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" [disabled]="updateJob.isPending()" (click)="submit()">Save</button>
</mat-dialog-actions>
